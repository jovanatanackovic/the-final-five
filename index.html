<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909">
<title>THE FINAL FIVE — Coul</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 5%,#30221d 0%,#101012 55%,#090909 100%);color:white;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,650px);text-align:center;padding:42px 20px}.eyebrow{font-size:11px;letter-spacing:.35em;color:#a3a3a3;font-weight:600}.hero{display:flex;align-items:center;justify-content:center;gap:12px;margin:32px 0 38px;font-size:clamp(70px,18vw,116px);font-weight:900;letter-spacing:-.075em;line-height:1}.arrow{color:#e45d45;display:inline-block;font-size:.75em;letter-spacing:0;animation:arrowPulse 2.5s ease-in-out infinite}@keyframes arrowPulse{0%,100%{transform:translateX(0);opacity:.78}50%{transform:translateX(9px);opacity:1}}.label{font-size:11px;letter-spacing:.24em;color:#888;margin-bottom:18px}.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.unit{background:#ffffff09;border:1px solid #ffffff0b;border-radius:11px;padding:20px 5px}.value{font-size:clamp(25px,6vw,44px);font-weight:750;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.unit:last-child .value{color:#e45d45}.unitname{font-size:10px;color:#999;letter-spacing:.08em;margin-top:8px}.range{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.07em;color:#aaa;margin:37px 0 10px}.track{height:7px;border-radius:50px;background:#292929;overflow:hidden}.fill{height:100%;width:0;background:#e45d45;border-radius:50px;transition:width 1s linear}.percent{text-align:right;color:#888;font-size:10px;margin-top:10px}.footer{border-top:1px solid #ffffff1a;margin-top:44px;padding-top:29px}.motto{font-size:21px;font-weight:700}.sub{font-size:13px;font-style:italic;color:#999;margin-top:9px}.small{font-size:10px;letter-spacing:.18em;color:#666;margin-top:52px}@media(max-width:400px){.wrap{padding:28px 0}.unit{padding:16px 2px}.unitname{font-size:9px}.eyebrow{font-size:10px}}
</style>
</head>
<body><main class="wrap"><header class="eyebrow">THE FINAL FIVE</header><div class="hero" aria-label="27 to 32"><span>27</span><span class="arrow" aria-hidden="true">→</span><span>32</span></div><div class="label">TIME REMAINING UNTIL THE VERDICT</div><section class="timer" aria-label="Countdown to Coul's 32nd birthday"><div class="unit"><div class="value" id="days">—</div><div class="unitname">DAYS</div></div><div class="unit"><div class="value" id="hours">—</div><div class="unitname">HOURS</div></div><div class="unit"><div class="value" id="minutes">—</div><div class="unitname">MIN</div></div><div class="unit"><div class="value" id="seconds">—</div><div class="unitname">SEC</div></div></section><div class="range"><span>AGE 27 · START</span><span>AGE 32 · DEADLINE</span></div><div class="track" role="progressbar" aria-label="Five-year plan progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack"><div class="fill" id="fill"></div></div><div class="percent" id="percent">0.00% COMPLETE</div><footer class="footer"><div class="motto">MAKE IT OR EXPLAIN IT.</div><div class="sub">Your friend will be watching.</div></footer><div class="small">COUL · 2026—2031</div></main>
<script>
// Midnight in Belgrade on the two birthdays. Serbia uses CET in November (UTC+01:00).
const start=Date.parse('2026-11-11T00:00:00+01:00');
const end=Date.parse('2031-11-11T00:00:00+01:00');
const $=id=>document.getElementById(id);
function update(){const now=Date.now();const ms=Math.max(0,end-now);const total=Math.floor(ms/1000);const vals={days:Math.floor(total/86400),hours:Math.floor(total/3600)%24,minutes:Math.floor(total/60)%60,seconds:total%60};for(const [k,v] of Object.entries(vals))$(k).textContent=k==='days'?String(v):String(v).padStart(2,'0');const pct=Math.max(0,Math.min(100,(now-start)/(end-start)*100));$('fill').style.width=pct+'%';$('percent').textContent=pct.toFixed(2)+'% COMPLETE';$('progressTrack').setAttribute('aria-valuenow',pct.toFixed(2));}
update();setInterval(update,1000);
</script></body></html>
